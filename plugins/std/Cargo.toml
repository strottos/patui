[package]
name = "patui-std"
version = "0.1.0"
authors = ["Steven Trotter <stevetrot@gmail.com>"]
edition = "2021"
resolver = "2"

[[bin]]
name = "patui-std"
path = "src/main.rs"

[dependencies]
async-stream = "0.3.6"
bytes = { version = "1.9.0", features = ["serde"] }
clap = { version = "4.5.23", features = ["cargo", "derive", "unicode", "string", "wrap_help"] }
chrono = { version = "0.4.38", features = ["serde"] }
miette = { version = "7.4.0", features = ["fancy"] }
patui-core = { path = "../../patui-core" }
prost = "0.13.4"
rmp-serde = "1.3.0"
serde = { version = "1.0.216", features = ["derive"] }
strip-ansi-escapes = "0.2.0"
tokio = { version = "1.41.1", features = [ "macros", "rt-multi-thread", "time" ] }
tokio-stream = "0.1.17"
tonic = "0.12.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.0.16"
assertor = "0.0.3"
escargot = "0.5.13"
tracing-test = "0.2.5"

[build-dependencies]
tonic-build = "0.12.3"

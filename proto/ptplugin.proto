syntax = "proto3";

package ptplugin;

message Diagnostic {
  enum Severity {
    ERROR = 0;
    WARNING = 1;
    INFO = 2;
    DEBUG = 3;
  }
  Severity severity = 1;
  string summary = 2;
  string detail = 3;
}

message StepRunner {
  string name = 1;
  string description = 2;
  string version = 3;
  string type = 4;
  repeated string subscriptions = 5;
}

// The `bytes` field contains the encoded information for a `PatuiData` struct
// encoded with MsgPack.
message PatuiDataEncoding { bytes bytes = 1; }

// The `bytes` field contains the encoded information for a `PatuiEvent` struct
// encoded with MsgPack.
message PatuiEventEncoding { bytes bytes = 1; }

// What the results will do:
// APPEND: Append the results to a list.
// SET: Set the results in a dictionary.
// CONFIRM: Confirm that the results are complete and set them all to known.
enum ResultType {
  APPEND = 0;
  SET = 1;
  CONFIRM = 2;
}

message GetInfo {
  message Request {}
  message Response { StepRunner step_runner = 1; }
}

message Init {
  message Request {
    uint64 client_id = 1;
    string step_name = 2;
    map<string, StepRunner> step_runners = 3;
    map<string, string> config = 4;
  }
  message Response { repeated Diagnostic diagnostics = 1; }
}

message Run {
  message Request {
    uint64 client_id = 1;
    string function = 2;
    map<string, string> args = 3;
  }
  message Response { repeated Diagnostic diagnostics = 1; }
}

message ProduceResults {
  message Init { uint64 client_id = 1; }
  message Request {
    uint64 result_id = 2;
    PatuiEventEncoding data = 3;
    repeated Diagnostic diagnostics = 4;
  }
}

message AckResult {
  message Request {
    uint64 client_id = 1;
    uint64 result_id = 2;
  }
  message Response {}
}

// ReceiveResults will be sent a stream of `PatuiData` messages encoded with
// MsgPack which are the results from other steps as they are obtained.
message ReceiveResults {
  message Request {
    // TODO: Possibly makes sense to take an expr here but then we'd need to
    // encode expr's too (which we've somehow gotten away with till now). On the
    // other hand can't think what we'd do with an expr here beyond this as
    // Patui controls this, see if something comes up.
    uint64 client_id = 1;
    string step_name = 2;
    string function_name = 3;
    string result_name = 4;
    ResultType type = 5;
    PatuiDataEncoding results = 6;
  }
  message Response { repeated Diagnostic diagnostics = 1; }
}

message Wait {
  message Request { uint64 client_id = 1; }
  message Response { repeated Diagnostic diagnostics = 1; }
}

message Shutdown {
  message Request {}
  message Response {}
}

service PluginService {
  rpc GetInfo(GetInfo.Request) returns (GetInfo.Response) {}
  rpc Init(Init.Request) returns (Init.Response) {}
  rpc Run(Run.Request) returns (Run.Response) {}
  // ProduceResults will be sent a stream of `PatuiEvent` messages encoded with
  // MsgPack from the plugin, that are the results from the run step as they are
  // obtained. This stream must be opened before receiving a run request.
  rpc ProduceResults(ProduceResults.Init)
      returns (stream ProduceResults.Request) {}
  // Patui will send a single ack for each message received on the `receive`
  // stream. This is to ensure that the plugin has received the message and
  // hence `wait` can be confident it can finish.
  rpc AckResult(AckResult.Request) returns (AckResult.Response) {}
  // This stream is used to send the results of other steps as they are obtained
  // and relevant to the plugin in question.
  rpc ReceiveResults(stream ReceiveResults.Request)
      returns (stream ReceiveResults.Response) {}
  rpc Wait(Wait.Request) returns (Wait.Response) {}
  rpc Shutdown(Shutdown.Request) returns (Shutdown.Response) {}
}

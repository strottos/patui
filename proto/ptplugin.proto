syntax = "proto3";

package ptplugin;

message Diagnostic {
    enum Severity {
        ERROR = 0;
        WARNING = 1;
        INFO = 2;
        DEBUG = 3;
    }
    Severity severity = 1;
    string summary = 2;
    string detail = 3;
}

message StepRunner {
    string name = 1;
    string description = 2;
    string version = 3;
    string type = 4;
    repeated string subscriptions = 5;
}

// The `bytes` field contains the encoded information encoded with MsgPack.
message PatuiDataEncoding {
    bytes bytes = 1;
}

message GetInfo {
    message Request {}
    message Response {
        StepRunner step_runner = 1;
    }
}

message Init {
    message Request {
        string                  step_name = 1;
        map<string, StepRunner> step_runners = 2;
        map<string, string>     config = 3;
    }
    message Response {
        repeated Diagnostic diagnostics = 1;
    }
}

message Run {
    message Request {
        string function = 1;
    }
    message Response {
        repeated Diagnostic diagnostics = 1;
    }
}

message Publish {
    message Request {
        string            function = 1;
        string            name     = 2;
        PatuiDataEncoding data     = 3;
    }
    message Response {
        repeated Diagnostic diagnostics = 1;
    }
}

message Subscribe {
    message Request {
        string function = 1;
        string name     = 2;
    }
    message Response {
        PatuiDataEncoding   data        = 1;
        repeated Diagnostic diagnostics = 2;
    }
}

message Wait {
    message Request {
    }
    message Response {
        repeated Diagnostic diagnostics = 2;
    }
}

message Shutdown {
    message Request {
    }
    message Response {
    }
}

service PluginService {
    rpc GetInfo(GetInfo.Request) returns (GetInfo.Response) {}
    rpc Init(Init.Request) returns (Init.Response) {}
    rpc Run(Run.Request) returns (Run.Response) {}
    rpc Publish(stream Publish.Request) returns (stream Publish.Response) {}
    rpc Subscribe(Subscribe.Request) returns (stream Subscribe.Response) {}
    rpc Wait(Wait.Request) returns (Wait.Response) {}
    rpc Shutdown(Shutdown.Request) returns (Shutdown.Response) {}
}

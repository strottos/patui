[package]
name = "patui-core"
version = "0.1.0"
authors = ["Steven Trotter <stevetrot@gmail.com>"]
edition = "2021"
resolver = "2"

[lib]
name = "patui_core"
crate-type = ["cdylib", "lib"]

[dependencies]
async-stream = "0.3.6"
bincode = "1.3.3"
blake3 = "1.5.5"
bytes = { version = "1.9.0", features = ["serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
edit = "0.1.5"
indexmap = "2.7.0"
logos = "0.15.0"
num = "0.4.3"
prost = "0.13.4"
rmp-serde = "1.3.0"
rug = { version = "1.26.1", features = ["serde"] }
serde = "1.0.216"
serde_json = "1.0.134"
serde_yaml = "0.9.34"
strum = "0.26.3"
strum_macros = "0.26.4"
textwrap = "0.16.1"
thiserror = "2.0.9"
tokio = { version = "1.42.0", features = ["fs", "io-util", "process", "rt-multi-thread", "macros", "time"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.13", features = ["io"] }
tonic = "0.12.3"
tracing = "0.1.41"

[dev-dependencies]
assertor = "0.0.3"
tracing-test = "0.2.5"

[build-dependencies]
tonic-build = "0.12.3"
